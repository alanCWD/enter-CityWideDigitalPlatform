project_id = "spb-t4n1w2j9jwhhc7h6"

# Note: verify_jwt = false has no effect on this platform's gateway — every
# backend function requires an Authorization header regardless of this setting.
# Kept here only in case that changes; do not rely on it for public endpoints.
[functions.stripe-webhook]
verify_jwt = false

[functions.trial-intake]
verify_jwt = false

[functions.contact-intake]
verify_jwt = false

# Read-only client feed for the SEO monitoring app. Authenticates with its own
# long-lived workspace keys (not user sessions), so the JWT check must be off.
[functions.seo-api]
verify_jwt = false

# Read-only workspace entitlement mirror for the Social Studio. Authenticates
# with its own workspace bearer tokens (hashed at rest), never user sessions, so
# the gateway JWT check must be off.
[functions.social-studio-entitlements]
verify_jwt = false

# The entitlement endpoint the Social Studio integrates with. One database call
# authenticates, rate-limits and logs; then the CRM and member reads run together.
[functions.studio-entitlements]
verify_jwt = false

# Super-admin screens for issuing and revoking studio tokens. Called by the
# dashboard with the signed-in user's session, so the gateway JWT check stays on.
[functions.studio-access-admin]
verify_jwt = true

# One-off sandbox helper that suspends/resumes the Starter sandbox client so the
# suspended-account contract can be verified. Inert once its secret is deleted.
[functions.sandbox-status-once]
verify_jwt = false

# Staging twin of the entitlement endpoint: same logic, exposes failure detail
# so the snapshot can be fixed. Not the endpoint the studio integrates with.
[functions.entitlements-staging]
verify_jwt = false

# One-time sandbox setup for the entitlement API. Guarded by a one-off secret
# hash and permanently disabled (410) once the sandbox workspaces exist.
[functions.studio-seed-once]
verify_jwt = false

# Content Studio integration: public read-only pull route plus staff actions.
# The pull route authenticates with its own rotatable token, so the gateway JWT
# check is off; staff POST actions verify the user session in the function.
[functions.recorder-sync]
verify_jwt = false

# Password endpoints. Declared explicitly so the platform manages them as
# versioned functions rather than default stubs.
[functions.cw-secure-reset]
verify_jwt = true

[functions.reset-alan-password]
verify_jwt = true
